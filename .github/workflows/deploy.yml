# Le jeu narratif validé ouvre à la racine et reste accessible sous /parcours/.
# L’ancien jeu est conservé sous /classique/ ; la préversion pédagogique reste sous /v2/.
# La préversion est figée à un commit relu et testé pour éviter les mises en ligne involontaires.
name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Construire et vérifier l’archive du jeu classique
        run: |
          node build.js
          node check.js
          mkdir -p site/classique
          cp index.html site/classique/index.html
          touch site/.nojekyll
      - name: Récupérer la préversion indépendante
        uses: actions/checkout@v4
        with:
          ref: 97988752bc50fbfb410c4fa01be1f27431736027
          path: _preview
          persist-credentials: false
      - name: Construire et vérifier la préversion
        working-directory: _preview
        run: |
          node build.js
          node check.js
          node --check classroom/learning.js
      - name: Ajouter la préversion pédagogique
        run: |
          mkdir -p site/v2
          cp _preview/index.html site/v2/index.html
          cmp index.html site/classique/index.html
      - name: Récupérer les parcours narratifs validés
        uses: actions/checkout@v4
        with:
          ref: 08cb033f0a278e1776cb186cadac2276beb19ee9
          path: _story
          persist-credentials: false
      - name: Vérifier et construire les parcours narratifs
        working-directory: _story
        run: |
          node --check classroom/story-motion.js
          node --check classroom/rights.js
          node --check classroom/report.js
          node classroom/check-story.cjs
          mkdir -p ../site/parcours
          node classroom/build-story.cjs ../site/parcours/index.html
          node -e "const fs=require('node:fs'),crypto=require('node:crypto');const html=fs.readFileSync('../site/parcours/index.html','utf8').replace(/\r\n/g,'\n');const sha=crypto.createHash('sha256').update(html).digest('hex');if(sha!=='b3de1c424242288d55ba0cf010cc2e5dbd8d8b60785934b0881f6eab844e7d19')throw new Error('Le HTML ne correspond pas à la version validée');console.log('HTML validé : '+sha);"
      - name: Publier les parcours à l’adresse principale
        run: |
          cp site/parcours/index.html site/index.html
          cp _story/LICENSE.txt site/conditions-utilisation.txt
          cmp site/parcours/index.html site/index.html
          cmp index.html site/classique/index.html
          cmp _preview/index.html site/v2/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
